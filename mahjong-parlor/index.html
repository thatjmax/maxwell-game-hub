<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f4d3a">
<title>Mahjong Parlor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">

  <!-- HOME -->
  <section id="home" class="screen active">
    <header class="home-top">
      <div>
        <h1 id="greeting">Hello!</h1>
        <p id="today" class="today"></p>
      </div>
      <button id="soundBtn" class="btn tool" aria-pressed="true"></button>
    </header>

    <div class="home-main">
      <div class="card challenger-card">
        <div id="homePortrait" class="portrait big"></div>
        <div class="challenger-info">
          <p class="eyebrow" id="homeEyebrow">Your challenger</p>
          <h2 id="homeName"></h2>
          <p id="homeTown" class="town"></p>
          <p id="homeRecord" class="record"></p>
          <button id="playBtn" class="btn primary huge">Play</button>
        </div>
      </div>
      <div class="card streak-card">
        <p class="streak-label">Win streak</p>
        <p id="streakNum" class="streak-num">0</p>
        <p id="bestStreak" class="best">Best: 0</p>
      </div>
    </div>

    <nav class="home-nav">
      <button id="dailyBtn" class="btn big">☀️ Puzzle of the Day</button>
      <button id="trophyBtn" class="btn big">🏆 My Trophies</button>
      <button id="guideBtn" class="btn big">📖 Guide</button>
    </nav>

    <button id="familyBtn" class="family-btn" aria-label="Family settings. Hold for 2 seconds.">
      <span id="familyFill" class="family-fill"></span><span class="family-label">⚙ Family</span>
    </button>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <header class="game-top">
      <button id="homeBtn" class="btn tool">⌂ Home</button>
      <div class="race">
        <div class="race-row">
          <span class="race-name">You</span>
          <div class="bar"><div id="youBar" class="fill you"></div></div>
          <span id="youCount" class="race-count"></span>
        </div>
        <div class="race-row" id="npcRow">
          <span class="race-name" id="npcName"></span>
          <div class="bar"><div id="npcBar" class="fill npc"></div></div>
          <span id="npcCount" class="race-count"></span>
        </div>
      </div>
      <div id="gamePortrait" class="portrait small"></div>
    </header>
    <div id="banner" class="banner hidden" role="status"></div>
    <div class="board-wrap">
      <div id="board" class="board" aria-label="Mahjong board"></div>
      <div id="bubble" class="bubble hidden" aria-live="polite"></div>
    </div>
    <div id="tip" class="tip hidden" role="status" aria-live="polite"></div>
    <footer class="game-controls">
      <button id="undoBtn" class="btn control">↶ Undo</button>
      <button id="hintBtn" class="btn control">💡 Hint</button>
      <button id="shuffleBtn" class="btn control">🔀 Shuffle</button>
    </footer>
  </section>

  <!-- GAME PICKER -->
  <section id="picker" class="screen">
    <header class="page-top">
      <button class="btn tool js-home">⌂ Home</button>
      <div id="pickerPortrait" class="portrait small"></div>
      <h1 id="pickerTitle">What shall we play?</h1>
    </header>
    <div id="pickerGrid" class="picker-grid"></div>
  </section>

  <!-- OTHER GAMES -->
  <section id="g2" class="screen">
    <header class="game-top">
      <button id="g2Home" class="btn tool">⌂ Home</button>
      <div class="g2-mid"><h2 id="g2Title"></h2><div id="g2Score" class="g2-score"></div></div>
      <button id="g2Rules" class="btn tool">❓ Rules</button>
      <div id="g2Portrait" class="portrait small"></div>
    </header>
    <div id="g2Msg" class="banner coach hidden" aria-live="polite"></div>
    <div class="board-wrap">
      <div id="g2Body" class="g2-body"></div>
      <div id="g2Bubble" class="bubble hidden" aria-live="polite"></div>
    </div>
    <div id="g2Tip" class="tip hidden" role="status" aria-live="polite"></div>
    <footer id="g2Ctrl" class="game-controls"></footer>
  </section>

  <!-- TROPHIES -->
  <section id="trophies" class="screen">
    <header class="page-top">
      <button class="btn tool js-home">⌂ Home</button>
      <h1>My Trophies</h1>
    </header>
    <div id="trophyStats" class="trophy-stats"></div>
    <div id="trophyGrid" class="trophy-grid"></div>
  </section>

  <!-- GUIDE -->
  <section id="guide" class="screen">
    <header class="page-top">
      <button class="btn tool js-home">⌂ Home</button>
      <h1>How to Play</h1>
      <button id="guidePracticeTop" class="btn tool primary">▶ Practice game</button>
    </header>
    <div id="guideBody" class="guide-body"></div>
  </section>

  <!-- FAMILY -->
  <section id="family" class="screen">
    <header class="page-top">
      <button class="btn tool js-home">✓ Done</button>
      <h1>Family Settings</h1>
    </header>
    <div id="familyBody" class="family-body"></div>
  </section>

</main>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div id="modalCard" class="modal-card"></div>
</div>

<input id="restoreInput" type="file" accept="application/json,.json" class="hidden">
<script src="app.js"></script>
<script src="games/klondike.js"></script>
<script src="games/gin.js"></script>
<script src="games/dominoes.js"></script>
<script src="games/checkers.js"></script>
<script src="games/dice.js"></script>
<script src="games/words.js"></script>
</body>
</html>
